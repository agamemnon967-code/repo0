<!doctype html>
<!-- GENERATED by tools/build.py from tools/index.template.html. Edit the template, then re-run. -->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: normal;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-Italic-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: italic;
      }

      /* DESIGN.md palette */
      :root {
        --night: #0e0b10;
        --white: #fbfbf6;
        --lime: #e6f54a;
        --alarm: #ff2e3f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--night);
      }

      /* ---------- Footage stack: all layers share one camera ---------- */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 570px 560px; /* her face */
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Red backdrop: red layer + subject cutout, over the plate ("…nothing."). */
      .redwin {
        opacity: 0;
      }
      .redbg {
        position: absolute;
        inset: 0;
        background: var(--alarm);
      }
      /* Text-behind-her moments: backdrop, huge condensed type, then her cutout on top. */
      .depth {
        opacity: 0;
      }
      .dshade {
        position: absolute;
        inset: 0;
        background: rgba(10, 10, 12, 0.62);
      }
      .dbg {
        position: absolute;
        inset: 0;
        background: #2b4cff;
      }
      .dword {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: "Archivo", sans-serif;
        font-style: normal;
        font-weight: 800;
        font-stretch: 72%;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        line-height: 0.86;
        white-space: nowrap;
        color: #ffffff;
        opacity: 0;
      }
      .dword.acc {
        color: #9fb0ff;
      }
      .dlab {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        white-space: nowrap;
        color: rgba(255, 255, 255, 0.78);
      }
      .dlab span {
        display: inline-block;
        opacity: 0;
        margin: 0 0.2em;
      }
      #bw-wrap,
      #blur-wrap {
        opacity: 0;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: var(--white);
        opacity: 0;
      }
      /* Blurred-footage scenes: blur plate + neutral dim, faded in/out per scene. */
      .sbg {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .sbg video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.08);
      }
      .sdim {
        position: absolute;
        inset: 0;
        background: rgba(12, 12, 14, 0.42);
      }
      /* Darkens desk/hands under the captions (applies above the cutout). */
      #scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 900px;
        background: linear-gradient(to top, rgba(14, 11, 16, 0.78) 0%, rgba(14, 11, 16, 0.55) 45%, rgba(14, 11, 16, 0) 100%);
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
      <div id="cam">
        <!-- Plate = source with the room dimmed and the subject re-laid on top (tools/make_plate.sh), cut into segments -->
        <div class="layer">
{{SEGMENTS}}
        </div>
        <div class="layer">
          <img id="end-hold" class="clip" src="assets/media/end-hold.jpg" alt="" data-start="{{HOLD_START}}" data-duration="{{HOLD_DUR}}" data-track-index="0" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" />
        </div>
        <div class="layer redwin" id="red-flag">
          <div class="redbg"></div>
          <video id="cut-flag" class="clip" src="assets/media/cutout-red.webm" muted playsinline data-start="{{RED_START}}" data-media-start="0" data-duration="{{RED_DUR}}" data-track-index="1"></video>
        </div>
{{DEPTH}}
        <div class="layer" id="bw-wrap">
{{BW}}
        </div>
        <div class="layer" id="blur-wrap">
{{BLUR}}
        </div>
      </div>
      <!-- Blurred-footage scene backgrounds -->
{{SCENE_BG}}
      <div id="scrim"></div>
      <div id="flash"></div>

      <!-- Voice, cut on the same segments as the picture -->
{{VOICE}}

      <!-- Props: one sub-composition per beat, each inside a single segment -->
{{HOSTS}}

      <!-- Captions (compositions/captions.html, generated) -->
      <div id="captions-slot" style="position: absolute; inset: 0">
        <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-track-kind="captions" data-start="0" data-duration="{{TOTAL}}" data-track-index="6" data-width="1080" data-height="1920"></div>
      </div>
    </div>

    <script>
      // ---------- Edit map (tools/edit_map.py): all times below are SOURCE seconds ----------
      const CUTS = {{CUTS}};
      const o = (s) => {
        let shift = 0;
        for (const [a, b] of CUTS) {
          if (s >= b) shift += b - a;
          else if (s > a) return a - shift;
        }
        return s - shift;
      };
      const FPS = 25;
      const tl = gsap.timeline({ paused: true });
      const cam = (vars, at, duration = 0, ease = "none") =>
        duration ? tl.to("#cam", { ...vars, duration, ease }, o(at)) : tl.set("#cam", vars, o(at));
      function shake(at, amp) {
        const f = 1 / FPS, t = o(at);
        tl.to("#cam", { x: amp, y: -amp * 0.6, duration: f, ease: "none" }, t);
        tl.to("#cam", { x: -amp * 0.8, y: amp * 0.5, duration: f, ease: "none" }, t + f);
        tl.to("#cam", { x: 0, y: 0, duration: f * 2, ease: "power1.out" }, t + 2 * f);
      }
{{MOMENTS}}

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
